services:
  web:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: development
    restart: unless-stopped
    volumes:
      - type: bind
        source: .
        target: /app
      - vendor-development:/app/vendor
      - node-modules-development:/app/node_modules
    networks:
      - laravel-development
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
        restart: true

  postgres:
    image: postgres:18
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data-development:/var/lib/postgresql
    networks:
      - laravel-development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  vite:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: development
    entrypoint: []
    command: sh -c "npm install && until [ -f /app/vendor/autoload.php ]; do sleep 2; done; npm run dev"
    healthcheck:
      disable: true
    volumes:
      - ./:/app
      - vendor-development:/app/vendor
      - node-modules-development:/app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - .env
    networks:
      - laravel-development

networks:
  laravel-development:

volumes:
  postgres-data-development:
  vendor-development:
  node-modules-development:
